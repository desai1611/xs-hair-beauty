<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="XS Hair & Beauty is a hair and beauty salon in Glenfield, Auckland offering haircuts, colour, threading, waxing, facials, and bridal & party packages." />
    <meta name="theme-color" content="#faf7f2" />

    <!-- Link previews (WhatsApp, Facebook, Instagram, iMessage...). Shows the logo and photo when the site is shared. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="XS Hair &amp; Beauty" />
    <meta property="og:locale" content="en_NZ" />
    <meta property="og:title" content="XS Hair &amp; Beauty | Hair &amp; Beauty Salon in Glenfield, Auckland" />
    <meta property="og:description" content="Nanoplastia, keratin, haircuts, colour, threading, waxing and facials in Glenfield, Auckland. Book online or call 022 342 3964." />
    <meta property="og:url" content="https://xshairbeauty.nz/" />
    <meta property="og:image" content="https://xshairbeauty.nz/og-image.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="XS Hair &amp; Beauty Salon, Glenfield, Auckland" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Tells Google the salon's address, hours and contact details (local business markup). -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "HairSalon",
        "name": "XS Hair & Beauty",
        "url": "https://xshairbeauty.nz/",
        "image": "https://xshairbeauty.nz/og-image.jpg",
        "logo": "https://xshairbeauty.nz/brand/logo.png",
        "description": "Hair and beauty salon in Glenfield, Auckland offering nanoplastia, keratin straightening, haircuts, colour, threading, waxing and facials.",
        "telephone": "+64 22 342 3964",
        "email": "xshairbeautysalon@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "25 Chartwell Avenue",
          "addressLocality": "Glenfield",
          "addressRegion": "Auckland",
          "postalCode": "0629",
          "addressCountry": "NZ"
        },
        "geo": { "@type": "GeoCoordinates", "latitude": -36.7834052, "longitude": 174.731783 },
        "openingHoursSpecification": [
          {
            "@type": "OpeningHoursSpecification",
            "dayOfWeek": ["Tuesday", "Wednesday", "Thursday", "Friday", "Saturday"],
            "opens": "09:30",
            "closes": "18:00"
          },
          { "@type": "OpeningHoursSpecification", "dayOfWeek": "Sunday", "opens": "10:00", "closes": "18:00" }
        ],
        "sameAs": [
          "https://www.instagram.com/xs_hair_and_beauty",
          "https://www.facebook.com/profile.php?id=61580372792720",
          "https://www.fresha.com/en-GB/a/xs-hair-and-beauty-salon-glenfield-marlborough-25-chartwell-avenue-ph4azzhq"
        ]
      }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,600;0,9..144,700;1,9..144,500;1,9..144,600&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>XS Hair & Beauty | Auckland Hair & Beauty Salon</title>
